
pipeline {
    agent any

    options {
        timestamps()
        disableConcurrentBuilds()
        skipDefaultCheckout(true)
    }

    parameters {
        choice(
            name: 'Environment',
            choices: ['dev', 'qa', 'uat', 'prod'],
            description: 'Select the environment'
        )
        choice(
            name: 'Terraform_Action',
            choices: ['init', 'plan', 'apply', 'destroy'],
            description: 'Select Terraform action'
        )
    }

    environment {
        AWS_REGION = 'us-east-1'
        AWS_DEFAULT_REGION = 'us-east-1'
        TF_IN_AUTOMATION = 'true'
    }

    stages {
        stage('Checkout Repository') {
            steps {
                checkout scm
            }
        }

        stage('Verify AWS Access') {
            steps {
                sh '''
                    echo "Verifying AWS Identity..."
                    aws sts get-caller-identity
                '''
            }
        }

        stage('Terraform Init') {
            steps {
                sh """
                    terraform init -reconfigure \\
                        -backend-config="backend_conf/backend_${params.Environment}.conf"
                """
            }
        }

        stage('Terraform Validate') {
            when {
                expression {
                    params.Terraform_Action == 'plan' ||
                    params.Terraform_Action == 'apply'
                }
            }
            steps {
                sh 'terraform validate'
            }
        }

        stage('Terraform Plan') {
            when {
                expression {
                    params.Terraform_Action == 'plan'
                }
            }
            steps {
                sh """
                    terraform plan \\
                        -var-file="env/${params.Environment}.tfvars"
                """
            }
        }

        stage('Terraform Apply') {
            when {
                expression {
                    params.Terraform_Action == 'apply'
                }
            }
            steps {
                sh """
                    terraform apply \\
                        -var-file="env/${params.Environment}.tfvars" \\
                        -auto-approve
                """
            }
        }

        stage('Terraform Destroy Approval') {
            when {
                expression {
                    params.Terraform_Action == 'destroy'
                }
            }
            steps {
                script {
                    input(
                        message: "Are you sure you want to DESTROY ${params.Environment} infrastructure?",
                        ok: 'Approve Destroy',
                        submitterParameter: 'APPROVED_BY'
                    )
                }
            }
        }

        stage('Terraform Destroy') {
            when {
                expression {
                    params.Terraform_Action == 'destroy'
                }
            }
            steps {
                sh """
                    terraform destroy \\
                        -var-file="env/${params.Environment}.tfvars" \\
                        -auto-approve
                """
            }
        }

        stage('Terraform Init Completed') {
            when {
                expression {
                    params.Terraform_Action == 'init'
                }
            }
            steps {
                echo 'Terraform initialization completed successfully.'
            }
        }
    }

    post {
        success {
            echo 'Terraform infrastructure pipeline completed successfully.'
        }
        failure {
            echo 'Terraform infrastructure pipeline failed. Check console output.'
        }
        aborted {
            echo 'Terraform pipeline was aborted.'
        }
        always {
            echo 'Terraform pipeline execution finished.'
        }
    }
}
